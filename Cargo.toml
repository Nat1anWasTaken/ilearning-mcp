[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
moodle = { path = "crates/moodle" }
mcp-backbone = "0.1.2"

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dashmap = "6"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
time = "0.3"
schemars = { version = "1", features = ["chrono04"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "multipart", "rustls"] }

# server
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
dotenvy = "0.15"
hmac = "0.12"

# moodle
md-5 = "0.10"
html2text = "0.15"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
mime_guess = "2"
